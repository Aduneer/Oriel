[package]
name = "oriel"
version = "0.1.0"
description = "A second-screen command center for Windows"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.13"
# Same majors as Tauri's own dependencies, so they're only compiled once.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Media_Control", "Storage_Streams"] }
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
